<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Wardogs обвесы</title>
<!-- Плашка для OBS (источник «Браузер», 1920×1080). С 1.8 ничего не считает сама: программа отдаёт в /state
     готовую плашку (поле view) — те же данные и тот же язык, что у плашки поверх игры. ?side=right — справа,
     ?demo=1 | saved | ammo | shotgun — пример без игры (программа должна быть запущена). -->
<style>
  :root {
    --bg: rgba(14, 16, 12, 0.92); --line: #3a3f30; --text: #e9ecdf; --dim: #9aa38a; --faint: #6d7560;
    --accent: #e8a33a; --good: #5fd068; --bad: #ff5a4e; --track: #25281f;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Bahnschrift", "Segoe UI", sans-serif; color: var(--text); }
  #panel {
    position: absolute; top: 24px; left: 24px; width: 380px; box-sizing: border-box;
    background: var(--bg); border-left: 4px solid var(--accent); padding: 14px 16px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    transform: translateX(-120%); opacity: 0; transition: transform .35s ease, opacity .35s ease;
  }
  #panel.show { transform: none; opacity: 1; }
  body.right #panel { left: auto; right: 24px; transform: translateX(120%); border-left: 0; border-right: 4px solid var(--accent); }
  body.right #panel.show { transform: none; }
  .sep { border-top: 1px solid var(--line); margin: 8px 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .weapon { font-size: 29px; font-weight: 700; line-height: 1; letter-spacing: .3px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--dim); margin-top: 8px; }
  .check.on { color: var(--accent); }
  .sq { width: 12px; height: 12px; border: 1px solid #6d7560; box-sizing: border-box; display: inline-block; }
  .on .sq { background: var(--accent); border-color: var(--accent); }
  .base { font-size: 13px; color: var(--dim); margin-top: 10px; }
  .line { display: grid; grid-template-columns: 78px 1fr; align-items: baseline; font-size: 15px; line-height: 22px; }
  .line .slot { font-size: 11px; color: var(--dim); text-transform: uppercase; }
  .line .gone { color: var(--dim); text-decoration: line-through; }
  .line .came { color: var(--accent); font-weight: 700; }
  .line .dim { color: var(--dim); }
  .line .note { color: var(--dim); font-size: 12px; line-height: 16px; }
  .row { display: grid; align-items: center; font-size: 15px; line-height: 24px; font-variant-numeric: tabular-nums; }
  .plain { grid-template-columns: 168px 110px 1fr; }
  .pair { grid-template-columns: 152px 50px 1fr 64px; }
  .cmp { grid-template-columns: 1fr 84px 84px; }
  .r { text-align: right; } .b { font-weight: 700; }
  .good { color: var(--good); } .bad { color: var(--bad); } .dim { color: var(--dim); } .acc { color: var(--accent); }
  .small-head { font-size: 9px; font-weight: 700; line-height: 15px; letter-spacing: .3px; }
  .bar { position: relative; height: 6px; background: var(--track); }
  .bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #777; }
  .bar .fill { position: absolute; top: 0; bottom: 0; }
  .bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); }
  .adv { font-size: 13px; text-align: right; }
  .smith-head { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 6px; }
  .modes { display: flex; gap: 4px; }
  .modes span { font-size: 11px; font-weight: 700; padding: 1px 6px; border: 1px solid #5b6250; color: var(--dim); }
  .modes span.on { background: var(--accent); border-color: var(--accent); color: #0e100c; }
  .adv-row { display: grid; grid-template-columns: 78px 1fr; align-items: baseline; font-size: 15px; line-height: 21px; }
  .adv-row .slot { font-size: 11px; color: var(--dim); }
  .adv-row .ok { color: var(--good); font-weight: 700; }
  .adv-now { margin-left: 78px; font-size: 12px; color: var(--accent); line-height: 17px; }
  .hint { margin-left: 78px; font-size: 11px; color: var(--dim); line-height: 18px; }
  .ttk-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .ttk-title { font-size: 11px; font-weight: 700; color: var(--accent); }
  .dists { display: flex; gap: 4px; }
  .dists span { font-size: 11px; font-weight: 700; padding: 0 6px; border: 1px solid #5b6250; color: var(--dim); }
  .dists span.on { background: var(--accent); border-color: var(--accent); color: #0e100c; }
  .hold { font-size: 11px; font-weight: 700; color: var(--good); }
  .ttk { display: grid; grid-template-columns: 96px repeat(5, 1fr); align-items: center; text-align: center; font-variant-numeric: tabular-nums; }
  .ttk.cols span { font-size: 9px; color: var(--dim); padding-bottom: 2px; }
  .ttk .lab { text-align: left; font-size: 15px; white-space: nowrap; }
  .ttk .lab.sel { color: var(--accent); font-weight: 700; }
  .ttk b { display: block; font-size: 16px; line-height: 20px; }
  .ttk small { display: block; font-size: 11px; color: var(--dim); line-height: 14px; padding-bottom: 4px; }
  .ttk .best b, .ttk .best small { color: var(--good); }
  .note { font-size: 13px; color: var(--dim); margin: 2px 0 4px; }
  .data { font-size: 9px; color: var(--dim); margin-top: 6px; }
</style>
</head>
<body>
<div id="panel"></div>
<script>
const params = new URLSearchParams(location.search);
if (params.get("side") === "right") document.body.classList.add("right");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// полоска стата: + вправо (лучше), − влево (хуже); f — доля половины полоски
function bar(f, tone, mark) {
  let html = `<span class="bar"><i class="mid"></i>`;
  if (f) html += `<i class="fill" style="${f > 0 ? `left:50%;width:${f * 50}%` : `right:50%;width:${-f * 50}%`};background:var(--${tone === "bad" ? "bad" : "good"})"></i>`;
  if (mark !== undefined && mark !== null) html += `<i class="mark" style="left:calc(${50 + mark * 50}% - 1px)"></i>`;
  return html + `</span>`;
}

function stats(v) {
  const s = v.stats;
  if (!s) return "";
  let h = "";
  if (s.kind === "pair")
    h += `<div class="row pair small-head"><span></span><span></span><span class="r acc">${esc(s.head[0])}</span><span class="r dim">${esc(s.head[1])}</span></div>` +
      s.rows.map(r => `<div class="row pair"><span>${esc(r.label)}</span>${bar(r.bar, r.tone, r.adv_on ? r.mark : null)}` +
        `<span class="adv ${r.adv_on ? "acc b" : "dim"}">${esc(r.adv)}</span><span class="r b ${r.tone}">${esc(r.now)}</span></div>`).join("");
  else if (s.kind === "compare")
    h += `<div class="row cmp small-head"><span class="acc">${esc(s.head[0])}</span><span class="r dim">${esc(s.head[1])}</span><span class="r dim">${esc(s.head[2])}</span></div>` +
      s.rows.map(r => `<div class="row cmp"><span>${esc(r.label)}</span><span class="r dim" style="font-size:13px">${esc(r.was)}</span><span class="r b ${r.tone}">${esc(r.now)}</span></div>`).join("");
  else
    h += s.rows.map(r => `<div class="row plain"><span>${esc(r.label)}</span>${r.tone === "dim" || r.tone === "text" ? "<span></span>" : bar(r.bar, r.tone)}` +
      `<span class="r b ${r.tone === "text" ? "" : r.tone}">${esc(r.now)}</span></div>`).join("");
  if (!s.rows.length) h += `<div class="row dim">${esc(v.empty)}</div>`;
  return h;
}

function smith(m) {
  if (!m) return "";
  let h = `<div class="sep"></div><div class="smith-head"><span class="check ${m.on ? "on" : ""}" style="margin:0"><i class="sq"></i>${esc(m.title)}</span>`;
  if (m.on) h += `<span class="modes">${m.modes.map((n, i) => `<span class="${i === m.mode ? "on" : ""}">${esc(n)}</span>`).join("")}</span>`;
  h += `</div>`;
  if (!m.on) return h;
  for (const a of m.advice) {
    h += `<div class="adv-row"><span class="slot">${esc(a.slot)}</span><span class="${a.ok ? "ok" : ""}">${a.ok ? "✓ " : ""}${esc(a.best)}</span></div>`;
    if (a.now) h += `<div class="adv-now">${esc(a.now)}</div>`;
  }
  if (m.nothing) h += `<div class="hint">${esc(m.nothing)}</div>`;
  return h + `<div class="hint">${esc(m.hint)}</div>`;
}

function ttk(t) {
  if (!t || !t.rows || !t.rows.length) return "";
  let h = `<div class="sep"></div><div class="ttk-head"><span class="ttk-title">${esc(t.title)}</span>`;
  if (t.buttons && t.buttons.length) h += `<span class="dists">${t.buttons.map(d => `<span class="${d === t.dist ? "on" : ""}">${d} ${esc(t.unit)}</span>`).join("")}</span>`;
  else if (t.hold) h += `<span class="hold">${esc(t.hold)}</span>`;
  h += `</div><div class="ttk cols"><span></span>${t.cols.map(c => `<span>${esc(c)}</span>`).join("")}</div>`;
  for (const [label, cells, sel] of t.rows)
    h += `<div class="ttk"><span class="lab ${sel ? "sel" : ""}">${sel ? "▶ " : ""}${esc(label)}</span>` +
      cells.map(c => c ? `<span class="${c[2] ? "best" : ""}"><b>${esc(c[0])}</b><small>${esc(c[1])}</small></span>` : `<span class="dim">—</span>`).join("") + `</div>`;
  if (t.note) h += `<div class="note">${esc(t.note)}</div>`;
  return h;
}

function render(v) {
  const panel = document.getElementById("panel");
  if (!v) { panel.classList.remove("show"); return; }
  document.documentElement.lang = v.lang || "ru";
  panel.innerHTML =
    `<div class="head"><span class="weapon">${esc(v.weapon)}</span><span class="check ${v.detail ? "on" : ""}"><i class="sq"></i>${esc(v.detail_text)}</span></div>` +
    `<div class="base">${esc(v.base)}</div><div class="sep"></div>` +
    v.lines.map(l => l.slot || l.st === "note"
      ? `<div class="line"><span class="slot">${esc(l.slot)}</span><span class="${l.st}">${esc(l.text)}</span></div>`
      : `<div class="line"><span class="${l.st}" style="grid-column:1/-1">${esc(l.text)}</span></div>`).join("") +
    `<div class="sep"></div>` + stats(v) + smith(v.smith) + ttk(v.ttk) + `<div class="data">${esc(v.data)}</div>`;
  panel.classList.add("show");
}

let last = "";
async function poll() {
  try {
    const r = await fetch("/state" + (params.has("demo") ? "?demo=" + encodeURIComponent(params.get("demo") || "1") : ""), { cache: "no-store" });
    const txt = await r.text();
    if (txt !== last) { last = txt; render(JSON.parse(txt).view); }
  } catch (e) { /* программа не запущена — просто ждём */ }
  setTimeout(poll, 500);
}
poll();
</script>
</body>
</html>
